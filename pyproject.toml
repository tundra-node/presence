[project]
name = "presence"
version = "0.1.0"
description = "Local activity and location tracker: ActivityWatch + Life Cycle in one daily timeline."
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
