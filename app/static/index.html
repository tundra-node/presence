<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presence</title>
  <style>
    :root { --bg: #111418; --panel: #1a1f25; --text: #e6e8eb; --muted: #8b949e; --accent: #5fb3a1; --place: #d9a35f; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 24px; border-bottom: 1px solid #252b33; }
    h1 { font-size: 20px; margin: 0 auto 0 0; }
    main { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 20px; padding: 20px 24px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    section { background: var(--panel); border-radius: 8px; padding: 16px; }
    h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
    input, button { font: inherit; color: var(--text); background: #232a32; border: 1px solid #333c47; border-radius: 6px; padding: 6px 10px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    #status { color: var(--muted); font-size: 13px; min-height: 20px; padding: 0 24px; margin-top: 8px; }
    .bar { margin-bottom: 8px; }
    .bar .row { display: flex; justify-content: space-between; font-size: 13px; }
    .bar .track { height: 6px; background: #262d35; border-radius: 3px; }
    .bar .fill { height: 100%; background: var(--accent); border-radius: 3px; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { display: grid; grid-template-columns: 60px 70px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid #222830; font-size: 14px; }
    li .time, li .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
    li.place .label { color: var(--place); }
    li .detail { color: var(--muted); display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Presence</h1>
    <input type="date" id="day" aria-label="Day">
    <button id="sync">Sync ActivityWatch</button>
    <label><input type="file" id="csv" accept=".csv,text/csv" hidden><span role="button" tabindex="0" id="csv-btn" style="cursor:pointer;border:1px solid #333c47;border-radius:6px;padding:6px 10px;background:#232a32">Import Life Cycle CSV</span></label>
  </header>
  <div id="status" role="status"></div>
  <main>
    <section><h2>Apps</h2><div id="apps"></div></section>
    <section><h2>Timeline</h2><ol id="timeline"></ol></section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const dayInput = $("day");
    const localISODate = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    dayInput.value = localISODate(new Date());

    function fmtDuration(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      return h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`;
    }
    function fmtTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function status(msg) { $("status").textContent = msg; }

    async function api(path, opts) {
      const res = await fetch(path, opts);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || res.statusText);
      return body;
    }

    async function load() {
      const day = dayInput.value;
      const [activity, timeline] = await Promise.all([
        api(`/api/activity?day=${day}`),
        api(`/api/timeline?day=${day}`),
      ]);

      const apps = $("apps");
      apps.replaceChildren();
      const max = activity.apps[0]?.seconds || 1;
      for (const a of activity.apps.slice(0, 15)) {
        const bar = el("div", "bar");
        const row = el("div", "row");
        row.append(el("span", "", a.app), el("span", "", fmtDuration(a.seconds)));
        const track = el("div", "track");
        const fill = el("div", "fill");
        fill.style.width = `${(a.seconds / max) * 100}%`;
        track.append(fill);
        bar.append(row, track);
        apps.append(bar);
      }
      if (!activity.apps.length) apps.append(el("p", "empty", "No app activity for this day. Try Sync ActivityWatch."));

      const list = $("timeline");
      list.replaceChildren();
      for (const item of timeline.items) {
        const li = el("li", item.kind);
        const label = el("span", "label", item.label);
        const wrap = el("span");
        wrap.append(label);
        if (item.detail) wrap.append(el("span", "detail", item.detail));
        li.append(el("span", "time", fmtTime(item.start)), el("span", "dur", fmtDuration(item.seconds)), wrap);
        list.append(li);
      }
      if (!timeline.items.length) list.append(el("p", "empty", "Nothing recorded yet."));
    }

    $("sync").addEventListener("click", async () => {
      status("Syncing ActivityWatch...");
      try {
        const r = await api(`/api/sync/activitywatch?day=${dayInput.value}`, { method: "POST" });
        status(`Fetched ${r.fetched} events, ${r.added} new.`);
        await load();
      } catch (e) { status(`Sync failed: ${e.message}`); }
    });

    $("csv-btn").addEventListener("click", () => $("csv").click());
    $("csv-btn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") $("csv").click(); });
    $("csv").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const form = new FormData();
      form.append("file", file);
      status(`Importing ${file.name}...`);
      try {
        const r = await api("/api/import/lifecycle", { method: "POST", body: form });
        status(`Parsed ${r.parsed} visits, ${r.added} new.`);
        await load();
      } catch (err) { status(`Import failed: ${err.message}`); }
      e.target.value = "";
    });

    dayInput.addEventListener("change", () => load().catch((e) => status(e.message)));
    load().catch((e) => status(e.message));
  </script>
</body>
</html>
